apiVersion: elasticdetectionrules.gopes0x00.internal/v1
kind: ElasticDetectionRule
metadata:
  name: sample-detection-rule
  namespace: elk
spec:
  name: "Sample Detection Rule - Suspicious Execution"
  description: "Detects execution of suspicious commands or binaries"
  type: "query"
  query: "process.name : \"cmd.exe\" or process.name : \"powershell.exe\""
  severity: "high"
  risk_score: 73
  enabled: true
