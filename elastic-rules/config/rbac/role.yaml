---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - elasticdetectionrules.gopes0x00.internal
  resources:
  - elasticdetectionrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - elasticdetectionrules.gopes0x00.internal
  resources:
  - elasticdetectionrules/finalizers
  verbs:
  - update
- apiGroups:
  - elasticdetectionrules.gopes0x00.internal
  resources:
  - elasticdetectionrules/status
  verbs:
  - get
  - patch
  - update
