# This rule is not used by the project elastic-rules itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to elasticdetectionrules.gopes0x00.internal resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: elastic-rules
    app.kubernetes.io/managed-by: kustomize
  name: elasticdetectionrule-viewer-role
rules:
- apiGroups:
  - elasticdetectionrules.gopes0x00.internal
  resources:
  - elasticdetectionrules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - elasticdetectionrules.gopes0x00.internal
  resources:
  - elasticdetectionrules/status
  verbs:
  - get
