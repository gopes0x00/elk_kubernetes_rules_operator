# This rule is not used by the project elastic-rules itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the elasticdetectionrules.gopes0x00.internal.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: elastic-rules
    app.kubernetes.io/managed-by: kustomize
  name: elasticdetectionrule-editor-role
rules:
- apiGroups:
  - elasticdetectionrules.gopes0x00.internal
  resources:
  - elasticdetectionrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - elasticdetectionrules.gopes0x00.internal
  resources:
  - elasticdetectionrules/status
  verbs:
  - get
